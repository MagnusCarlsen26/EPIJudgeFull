name: Frontend Vercel

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-vercel.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-vercel.yml"
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build and verify frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Verify data generation
        run: npm run build:data

      - name: Verify generated deploy artifacts
        shell: bash
        run: |
          test -f public/index.html
          test -f public/data/manifest.json

          problems_path=$(node -e "const fs=require('node:fs'); const manifest=JSON.parse(fs.readFileSync('public/data/manifest.json','utf8')); if (!manifest.problems) process.exit(1); process.stdout.write(manifest.problems);")
          test -n "$problems_path"
          test -f "public${problems_path}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-public
          path: frontend/public

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build-and-verify
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Pull Vercel environment
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN"
          else
            npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          fi

      - name: Build with Vercel
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx vercel@latest build --yes --token="$VERCEL_TOKEN"
          else
            npx vercel@latest build --prod --yes --token="$VERCEL_TOKEN"
          fi

      - name: Deploy preview to Vercel
        if: github.event_name == 'pull_request'
        id: deploy_preview
        shell: bash
        run: |
          url=$(npx vercel@latest deploy --prebuilt --yes --token="$VERCEL_TOKEN" | tail -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Deploy production to Vercel
        if: github.event_name != 'pull_request'
        id: deploy_production
        shell: bash
        run: |
          url=$(npx vercel@latest deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" | tail -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Publish deployment summary
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            url="${{ steps.deploy_preview.outputs.url }}"
            target="Preview"
          else
            url="${{ steps.deploy_production.outputs.url }}"
            target="Production"
          fi

          {
            echo "## Frontend Vercel Deployment"
            echo
            echo "- Target: ${target}"
            echo "- URL: ${url}"
          } >> "$GITHUB_STEP_SUMMARY"
